<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LinkUp - Iniciar Sesión</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles/login.css" />
    <link rel="icon" href="./images/linkup.png" type="image/png" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <h1>Inicia Sesión</h1>
    <form id="loginForm" class="d-flex flex-column align-items-center gap-3">
      <div class="d-flex flex-column">
        <input
          type="text"
          id="correo"
          class="contform iusuario"
          placeholder="Correo"
        />
        <span id="errorCorreo" class="text-white small"></span>
      </div>
      <div class="d-flex flex-column">
        <input
          id="contra"
          type="password"
          class="contform icontra"
          placeholder="Contraseña"
        />
        <span id="errorContra" class="text-white small"></span>
      </div>
      <a href="./views/register.html">¿No tienes una cuenta? ¡Regístrate!</a>
      <button type="submit" class="btn btn-login">Ingresar</button>
    </form>
  </body>
  <script src="../scripts/login.js" type="module"></script>
</html>
