<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../styles/homepage.css" />
    <link rel="icon" href="../images/linkup.png" type="image/png" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <title>Buscar</title>
  </head>
  <body>
    <!--Encabezado-->
    <header>LinkUp</header>
    <!--Cuerpo principal de la ventana-->
    <div class="principal-container">
      <!--Navbar-->
      <nav class="navbar">
        <a href="./homepage.html">
          <i class="fa-solid fa-house"></i>
          <span class="text-button">Inicio</span>
        </a>
        <a href="./create.html">
          <i class="fa-solid fa-plus"></i>
          <span class="text-button">Crear</span>
        </a>
        <a href="./search.html">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span class="text-button">Buscar</span>
        </a>
        <a href="./myProfile.html">
          <i class="fa-solid fa-circle-user"></i>
          <span class="text-button">Mi Perfil</span>
        </a>
        <button id="salir">
          <i class="fa-solid fa-right-from-bracket"></i>
          <span class="text-button">Cerrar sesión</span>
        </button>
      </nav>
      <main>
        <section class="search">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="Buscar Usuarios" id="search-input" />
        </section>
        <section id="search-friends-container">
          <h3>¡Encuentra nuevos usuarios!</h3>
        </section>
        <!--Publicación-->
      </main>
      <aside class="side-menu">
        <section class="title">
          <h3>Mis amigos:</h3>
        </section>
        <section class="friends" id="friends-container"></section>
      </aside>
    </div>
  </body>
  <script src="../scripts/search.js" type="module"></script>
  <script src="../scripts/logout.js" type="module"></script>
  <script src="../scripts/asideFriends.js" type="module"></script>
</html>
