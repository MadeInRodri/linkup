<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <link rel="stylesheet" href="../styles/homepage.css" />
    <link rel="stylesheet" href="../styles/create.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" href="../images/linkup.png" type="image/png" />
    <title>Crear</title>
  </head>
  <body>
    <!--Encabezado-->
    <header>LinkUp</header>
    <!--Cuerpo principal de la ventana-->
    <div class="principal-container">
      <!--Navbar-->
      <nav class="navbar">
        <a href="./homepage.html">
          <i class="fa-solid fa-house"></i>
          <span class="text-button">Inicio</span>
        </a>
        <a href="./create.html">
          <i class="fa-solid fa-plus"></i>
          <span class="text-button">Crear</span>
        </a>
        <a href="./search.html">
          <i class="fa-solid fa-magnifying-glass"></i>
          <span class="text-button">Buscar</span>
        </a>
        <a href="./myProfile.html">
          <i class="fa-solid fa-circle-user"></i>
          <span class="text-button">Mi Perfil</span>
        </a>
      </nav>
      <main>
        <!--Crear Post-->
        <article class="create-container">
          <picture>
            <img src="" id="profile-img" />
          </picture>
          <section>
            <textarea
              placeholder="Escribe algo:"
              id="textarea-post"
              cols="3"
            ></textarea>
            <div class="create-buttons">
              <button class="create-button" id="upload-btn">
                <i class="fa-solid fa-image"></i>
                <span>Agrega una imágen</span>
              </button>
              <input type="file" id="file-input" accept="image/*" hidden />
              <button class="create-button" id="publish-btn">Publicar</button>
            </div>
          </section>
        </article>
        <h3>Vista previa:</h3>
        <!--Publicación-->
        <article class="post-container" id="post-container"></article>
      </main>
      <aside class="side-menu">
        <section class="title">
          <h3>Mis amigos:</h3>
        </section>
        <section class="friends" id="friends-container"></section>
      </aside>
    </div>
  </body>
  <script src="../scripts/asideFriends.js" type="module"></script>
  <script src="../scripts/create.js" type="module"></script>
</html>
