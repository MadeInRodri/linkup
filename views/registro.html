<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Lobster&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="registro.css" />
  </head>
  <body>
    <h1>Registrarse</h1>
    <form id="loginForm" class="d-flex flex-column align-items-center gap-3">
      <input
        id="nombre"
        type="text"
        class="contform iusuario"
        placeholder="Nombre"
      />
      <input
        id="apellido"
        type="text"
        class="contform iusuario"
        placeholder="Apellido"
      />
      <input
        id="usuario"
        type="text"
        class="contform iusuario"
        placeholder="Usuario"
      />
      <input
        id="correo"
        type="text"
        class="contform iusuario"
        placeholder="Email"
      />
      <input
        id="contra"
        type="password"
        class="contform icontra"
        placeholder="Contraseña"
      />
      <button type="submit" class="btn btn-login">Ingresar</button>
    </form>
  </body>
  <script src="registro.js"></script>
</html>
